site_name: GoodLiveClimax ドキュメント
site_description: 個人VTuber向けライブ演出ソフト「GoodLiveClimax」の公式ドキュメント
site_url: https://zainnstar.github.io/GoodLiveClimax_Document/
copyright: Copyright &copy; 2026 稲峰幸助 Inamine Kosuke - GoodLuckLab

theme:
  name: material
  language: ja
  logo: img/GLClimax_Icon.png
  favicon: img/GLClimax_Icon.png
  palette:
    # ライトモード
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    # ダークモード
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables

